name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agency
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency" --health-interval 3s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agency:ci-only-password@localhost:5432/agency
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make test
